schema: spec-driven

context: |
  Backend of a Telegram dating bot. The bot is the only client.
  Stack: Python 3.14, FastAPI, SQLAlchemy 2 (async, asyncpg), PostgreSQL 18, Alembic,
  Pydantic v2, uv. 
  Code lives in src/magicvibe/<domain>/, tests in tests/<domain>/.

  The docs in docs/ are the source of truth. Start with docs/README.md: it lists every
  document and what it holds. Read the ones that matter for the change, and use the terms
  from docs/glossary.md.

rules:
  specs:
    - Capability names are kebab-case, for example api-errors, accounts, profile, profile-images, preferences, discovery, reactions, plans, reports, bans.
    - Specs describe API behavior (endpoints, statuses, error codes), not business reasons; the reasons stay in the PRD.
  tasks:
    - If a business rule changes, add a task to update docs/prd.md or docs/plans.md.
    - If the data model changes, add a task to update docs/architecture/models.md.
    - If an error code is added, add a task to update docs/architecture/errors.md.
